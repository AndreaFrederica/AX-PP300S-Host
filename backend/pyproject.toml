[project]
name = "ax-pp300-host"
version = "0.1.0"
description = "Web-based host controller for AX PP300 buck-boost CNC power supply."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "pyserial>=3.5",
    "uvicorn>=0.44.0",
    "websockets>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ax_pp300"]

[project.scripts]
ax-pp300-host = "ax_pp300.main:main"

